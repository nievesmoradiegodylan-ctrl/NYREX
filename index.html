<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;display=swap');

        :root {
            --bubble-width: 320px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background: transparent;
            overflow: hidden;
            font-family: 'Inter', Arial, sans-serif;
        }

        .bubble {
            position: fixed;
            bottom: 40px;
            right: 40px;
            display: flex;
            align-items: center;
            gap: 14px;
            background: #000000;
            border: 2px solid #ffffff;
            border-radius: 9999px;
            padding: 10px 26px 10px 10px;
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.7),
                        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            color: #ffffff;
            white-space: nowrap;
            width: var(--bubble-width);
            animation: slideNotification 6000ms infinite cubic-bezier(0.25, 0.1, 0.25, 1);
            will-change: transform;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform-style: preserve-3d;
            z-index: 9999;
        }

        .icon {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #ffffff;
            background: #111111;
        }

        .icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: 50% 28%;
            display: block;
            filter: grayscale(100%) brightness(1.1);
        }

        .text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            line-height: 1;
        }

        .top {
            font-size: 21px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .bottom {
            font-size: 14.5px;
            font-weight: 400;
            opacity: 0.9;
            letter-spacing: 0.5px;
        }

        .bottom a {
            color: #ffffff;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .bottom a:hover {
            opacity: 1;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        @keyframes slideNotification {
            0% {
                transform: translate3d(140%, 0, 0);
            }
            15% {
                transform: translate3d(0, 0, 0);
            }
            68% {
                transform: translate3d(0, 0, 0);
            }
            85% {
                transform: translate3d(140%, 0, 0);
            }
            100% {
                transform: translate3d(140%, 0, 0);
            }
        }

        .bubble::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 9999px;
            border: 2px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
            animation: borderPulse 3000ms infinite ease-in-out;
            opacity: 0;
        }

        @keyframes borderPulse {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="bubble">
        <!-- Captain Price circular avatar (face-centered crop from MW19) -->
        <div class="icon">
            <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhMF307_MARedBCy90pb7s1tgL0MTdzgtBXQUHvP2wkKFRKvBV4M-yV9iysG2_lYXR1DqDaPebB5ttVqhPiuxif_3WOw2UixVQIR3zPjaJAquRnl2BMeNpR0Ly0ksGV-aX2vTFmjF1mUY9H/w0/call-of-duty-modern-warfare-captain-price-smoking-uhdpaper.com-4K-5.jpg" alt="">
        </div>
        
        <div class="text">
            <div class="top">IW8 MOD</div>
            <div class="bottom">
                <a href="https://discord.gg/demonware" target="_blank" rel="noopener">discord.gg/demonware</a>
            </div>
        </div>
    </div>
</body>
</html>
